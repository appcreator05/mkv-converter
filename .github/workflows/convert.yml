name: Fast MKV to MP4 Converter

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'আপনার MKV ভিডিওর ডিরেক্ট ডাউনলোড লিংক'
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download MKV Video
        run: curl -L "${{ github.event.inputs.video_url }}" -o input.mkv

      - name: Convert to MP4 with Perfect Encoding
        run: |
          ffmpeg -i input.mkv -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart output.mp4

      - name: Upload MP4 Result
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output.mp4
          retention-days: 1
