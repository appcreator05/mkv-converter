name: Direct MP4 Converter

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'আপনার MKV ভিডিওর ডিরেক্ট ডাউনলোড লিংক'
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download MKV Video
        run: curl -L "${{ github.event.inputs.video_url }}" -o input.mkv

      - name: Convert to MP4 with Perfect Encoding & Thumbnail Support
        run: |
          ffmpeg -i input.mkv -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart output.mp4

      - name: Upload to Transfer.sh
        run: |
          echo "Uploading MP4 file to direct download server..."
          DOWNLOAD_LINK=$(curl --upload-file output.mp4 https://transfer.sh/output.mp4)
          echo "===================================================="
          echo "আপনার সরাসরি MP4 ডাউনলোডের লিংক নিচে দেওয়া হলো:"
          echo "$DOWNLOAD_LINK"
          echo "===================================================="
